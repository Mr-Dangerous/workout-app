<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Timer — Focus Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; gap: 48px; padding: 40px 16px; }
    .phone-label { color: #555; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin-bottom: -36px; }
    .phone {
      width: 375px;
      min-height: 812px;
      background: #0f0f0f;
      border-radius: 48px;
      border: 2px solid #2a2a2a;
      box-shadow: 0 0 0 8px #1a1a1a, 0 32px 80px rgba(0,0,0,.8);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    /* Status bar */
    .status-bar { height: 44px; background: #0f0f0f; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; flex-shrink: 0; }
    .status-time { color: #fff; font-size: 15px; font-weight: 600; }
    .status-icons { display: flex; gap: 6px; align-items: center; }
    .status-icons svg { width: 16px; height: 16px; fill: #fff; }

    /* Accent */
    :root { --accent: #22c55e; --accent-dim: rgba(34,197,94,.15); --accent-glow: rgba(34,197,94,.35); }

    /* Progress bar */
    .progress-rail { height: 3px; background: #1f1f1f; flex-shrink: 0; }
    .progress-fill { height: 3px; background: var(--accent); width: 60%; transition: width .3s; }

    /* Screen content */
    .screen { flex: 1; display: flex; flex-direction: column; padding: 0 28px 28px; }

    /* Top strip */
    .top-strip { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 0; }
    .workout-title { color: #555; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
    .close-btn { width: 32px; height: 32px; border-radius: 50%; background: #1e1e1e; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
    .close-btn svg { width: 14px; height: 14px; stroke: #888; }

    /* Group / set */
    .meta-row { display: flex; align-items: center; gap: 10px; margin-top: 32px; }
    .badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 100px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .badge-group { background: #1e1e1e; color: #888; }
    .badge-set { background: #1e1e1e; color: #888; }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; background: #333; margin: 0 2px; }

    /* Exercise name */
    .exercise-name { margin-top: 20px; color: #fff; font-size: 36px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
    .side-label { display: inline-block; margin-top: 10px; color: var(--accent); font-size: 14px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }

    /* Timer */
    .timer-container { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; position: relative; }
    .timer-ring-wrap { position: relative; width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; }
    .timer-ring-wrap svg { position: absolute; top: 0; left: 0; }
    .timer-digits { font-size: 80px; font-weight: 900; color: #fff; letter-spacing: -.04em; line-height: 1; z-index: 1; font-variant-numeric: tabular-nums; }

    /* Controls */
    .controls { display: flex; align-items: center; justify-content: center; gap: 24px; padding-bottom: 8px; }
    .ctrl-btn { width: 52px; height: 52px; border-radius: 50%; background: #1e1e1e; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .ctrl-btn svg { width: 20px; height: 20px; stroke: #888; fill: none; }
    .ctrl-btn-primary { width: 72px; height: 72px; background: var(--accent); box-shadow: 0 0 32px var(--accent-glow); }
    .ctrl-btn-primary svg { width: 28px; height: 28px; stroke: #000; stroke-width: 2.5; }

    /* Next exercise */
    .next-row { margin-top: 28px; background: #161616; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    .next-label { color: #444; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; flex-shrink: 0; }
    .next-name { color: #777; font-size: 14px; font-weight: 500; }
    .next-arrow { margin-left: auto; flex-shrink: 0; }
    .next-arrow svg { width: 14px; height: 14px; stroke: #444; fill: none; }

    /* Screen 2 — same phone, different state label */
    .screen-label { color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; text-align: center; padding: 10px 0 4px; border-top: 1px solid #1a1a1a; background: #0f0f0f; }

    /* --- REST SCREEN --- */
    .rest-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 28px 40px; }
    .rest-heading { color: #888; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 16px; }
    .rest-timer { font-size: 96px; font-weight: 900; color: #fff; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; }
    .rest-sub { color: #444; font-size: 13px; margin-top: 12px; }
    .rest-next-label { color: #555; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-top: 40px; margin-bottom: 8px; }
    .rest-next-name { color: #fff; font-size: 22px; font-weight: 700; }
    .rest-next-side { color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-top: 6px; }
    .skip-rest { margin-top: 40px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 100px; padding: 14px 36px; color: #888; font-size: 14px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<!-- ===== PHONE 1: ACTIVE EXERCISE ===== -->
<div class="phone-label">Focus Mode — Active Exercise</div>
<div class="phone">
  <!-- Status bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24"><path d="M1 8l11-5 11 5v2H1V8z"/><rect x="3" y="10" width="18" height="10" rx="1"/></svg>
      <svg viewBox="0 0 24 24"><rect x="1" y="6" width="18" height="12" rx="2"/><path d="M23 10v4"/></svg>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-rail"><div class="progress-fill"></div></div>

  <!-- Screen: Active -->
  <div class="screen">
    <div class="top-strip">
      <span class="workout-title">Full Body Bands A</span>
      <button class="close-btn">
        <svg viewBox="0 0 24 24" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="meta-row">
      <span class="badge badge-group">Group B</span>
      <span class="badge-dot"></span>
      <span class="badge badge-set">Set 2 of 3</span>
    </div>

    <div class="exercise-name">Hammer Curls</div>
    <div class="side-label">▶ RIGHT</div>

    <!-- Timer -->
    <div class="timer-container">
      <div class="timer-ring-wrap">
        <svg width="240" height="240" viewBox="0 0 240 240">
          <!-- Background ring -->
          <circle cx="120" cy="120" r="108" fill="none" stroke="#1e1e1e" stroke-width="6"/>
          <!-- Progress arc — 23s of 40s = 57.5%, reversed = going down -->
          <circle cx="120" cy="120" r="108"
            fill="none"
            stroke="#22c55e"
            stroke-width="6"
            stroke-linecap="round"
            stroke-dasharray="678.6"
            stroke-dashoffset="288"
            transform="rotate(-90 120 120)"
            style="filter: drop-shadow(0 0 8px rgba(34,197,94,.6))"
          />
        </svg>
        <span class="timer-digits">0:23</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn" title="Back">
        <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="ctrl-btn ctrl-btn-primary" title="Pause">
        <svg viewBox="0 0 24 24" stroke-width="2.5"><line x1="10" y1="7" x2="10" y2="17"/><line x1="14" y1="7" x2="14" y2="17"/></svg>
      </button>
      <button class="ctrl-btn" title="Skip">
        <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <!-- Next exercise -->
    <div class="next-row">
      <span class="next-label">Next</span>
      <span class="next-name">Overhead Tricep Ext.</span>
      <span class="next-arrow"><svg viewBox="0 0 24 24" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></span>
    </div>
  </div>
</div>

<!-- ===== PHONE 2: REST SCREEN ===== -->
<div class="phone-label">Focus Mode — Rest Screen</div>
<div class="phone">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24"><rect x="1" y="6" width="18" height="12" rx="2"/><path d="M23 10v4"/></svg>
    </div>
  </div>
  <div class="progress-rail"><div class="progress-fill" style="width:63%"></div></div>

  <div class="rest-screen">
    <div class="rest-heading">Rest</div>
    <div class="rest-timer">0:45</div>
    <div class="rest-sub">After Set 2 of 3</div>

    <div class="rest-next-label">Up next</div>
    <div class="rest-next-name">Hammer Curls</div>
    <div class="rest-next-side">LEFT</div>

    <button class="skip-rest">Skip Rest</button>
  </div>
</div>

</body>
</html>
